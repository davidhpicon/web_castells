<!doctype html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <script>
    // Redirect SPA routes back to index.html for GitHub Pages
    // Detects base path automatically from the current pathname
    var segments = window.location.pathname.split('/');
    var base = '/' + (segments[1] || '');
    var rest = '/' + segments.slice(2).join('/');
    var search = window.location.search;
    var hash = window.location.hash;
    var redirect = base + '/?p=' + encodeURIComponent(rest + search) + hash;
    window.location.replace(redirect);
  </script>
</head>
<body></body>
</html>
