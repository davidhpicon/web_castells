<!doctype html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <script>
    // Redirect SPA routes to index.html for GitHub Pages
    const path = window.location.pathname.replace('/web_castells', '') || '/';
    const search = window.location.search;
    const hash = window.location.hash;
    const redirectUrl = '/web_castells/?p=' + encodeURIComponent(path + search) + hash;
    window.location.replace(redirectUrl);
  </script>
</head>
<body></body>
</html>
